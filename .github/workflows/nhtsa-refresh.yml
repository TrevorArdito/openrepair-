# Keeps NHTSA recalls, complaints and the TSB index fresh in the live database, for free.
# Setup (owner): GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret: PROD_DATABASE_URL = your Neon connection string.
# Note: GitHub only runs scheduled workflows from the default branch (main).
name: NHTSA data refresh

on:
  schedule:
    - cron: "17 7 * * 1" # every Monday 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Check setup
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL secret is not set — nothing to refresh."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - if: steps.cfg.outputs.skip != 'true'
        run: pip install .
      - name: Refresh recalls and complaints
        if: steps.cfg.outputs.skip != 'true'
        run: python -m app.importers.nhtsa refresh
      - name: Import the latest TSB index
        if: steps.cfg.outputs.skip != 'true'
        run: python -m app.importers.nhtsa tsbs --period 2025-2026
