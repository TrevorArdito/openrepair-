[project]
name = "chrystalclear-backend"
version = "0.1.0"
description = "ChrystalClear API server — free, open-source auto repair information"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.14",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "psycopg[binary]>=3.2",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # auto-generated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # our alembic/ folder shouldn't make it look first-party
