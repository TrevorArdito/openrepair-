# One-command dev setup:  docker compose up
# Then open http://localhost:5173  (API docs: http://localhost:8000/api/v1/docs)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chrystalclear
      POSTGRES_PASSWORD: chrystalclear   # local dev only
      POSTGRES_DB: chrystalclear
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chrystalclear"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://chrystalclear:chrystalclear@db:5432/chrystalclear
      APP_ENV: development
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:8000
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
