# One-click free deployment on Render (see docs/DEPLOY.md).
# Render builds the root Dockerfile: one container serves the API and the app.
services:
  - type: web
    name: chrystalclear
    runtime: docker
    plan: free
    region: ohio # same region as the Neon database (AWS US East, Ohio)
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # long random value, created by Render
      - key: DATABASE_URL
        sync: false # paste your Neon connection string when asked
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://chrystalclear.onrender.com (no trailing slash)
      - key: ADMIN_EMAILS
        sync: false # your email — that account becomes admin when you sign up
      - key: STORAGE_BACKEND
        value: database # free hosts wipe their disk on restart, so photos live in the database
      # Marketplace + payments are OFF until you set these (see docs/PAYMENTS.md).
      - key: ENABLE_MARKETPLACE
        value: "true" # parts + vehicles marketplace is on; in-app payments stay off below
      - key: MARKET_DEMO_DATA
        value: "true" # sample "DEMO —" listings for showing yards; set "false" to remove them
      - key: MARKET_DEMO_CITY
        value: "River Valley"
      - key: MARKET_DEMO_STATE
        value: "CA"
      - key: ENABLE_MARKET_PAYMENTS
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false # sk_test_… from Stripe → Developers → API keys (secret: never commit it)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # whsec_… from Stripe → Developers → Webhooks (Connect endpoint)
      - key: MARKET_FEE_PERCENT
        value: "6"
      - key: MARKET_TAX_ENABLED
        value: "false" # turn on only after your CPA confirms
